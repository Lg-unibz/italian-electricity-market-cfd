[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "italian-electricity-market-cfd"
version = "1.0.0"
description = "Reproducible historical Italian wind CfD backtest and preprocessing pipeline"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {file = "LICENSE"}
authors = [{name = "Lorenzo Gambadori"}]
dependencies = [
  "cdsapi>=0.7",
  "matplotlib>=3.10",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyproj>=3.7",
  "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]
